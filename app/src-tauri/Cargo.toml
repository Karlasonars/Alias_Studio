[package]
name = "alias-studio-app"
version = "0.1.0"
description = "Alias Studio — long video in, scored vertical clips out"
license = "AGPL-3.0-or-later"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# T-16 auto-update: the updater verifies minisign signatures against the
# pubkey in tauri.conf.json and refuses unsigned payloads; process provides
# the post-install relaunch on the platforms whose installer does not
# restart the app itself.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# T-07 cancel: raw Job Object calls (CreateJobObjectW / AssignProcessToJobObject /
# TerminateJobObject / CloseHandle) - hand-rolled over the win32job crate to keep
# the licence-audit surface (T-18) one crate smaller; the API needed is 4 calls.
# Win32_System_Threading: JOBOBJECT_EXTENDED_LIMIT_INFORMATION embeds
# Threading::IO_COUNTERS, needed for the setup child's KILL_ON_JOB_CLOSE.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
# T-07 cancel on macOS: killpg of the job's process group. Unverified until T-19.
libc = "0.2"

[profile.release]
strip = true
lto = true
