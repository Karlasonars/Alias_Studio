[package]
name = "alias-studio-app"
version = "0.1.0"
description = "Alias Studio — long video in, scored vertical clips out"
license = "AGPL-3.0-or-later"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# T-07 cancel: raw Job Object calls (CreateJobObjectW / AssignProcessToJobObject /
# TerminateJobObject / CloseHandle) - hand-rolled over the win32job crate to keep
# the licence-audit surface (T-18) one crate smaller; the API needed is 4 calls.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }

[target.'cfg(unix)'.dependencies]
# T-07 cancel on macOS: killpg of the job's process group. Unverified until T-19.
libc = "0.2"

[profile.release]
strip = true
lto = true
