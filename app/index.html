<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alias Studio</title>
    <script>
      try {
        var t = localStorage.getItem('publikclip-theme')
        if (t && t !== 'bay') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
